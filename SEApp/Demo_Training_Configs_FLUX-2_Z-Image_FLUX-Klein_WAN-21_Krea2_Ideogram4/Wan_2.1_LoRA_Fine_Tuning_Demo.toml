# Wan 2.1 is fine-tuned through LoRA because this backend has no full-Wan trainer.
training_mode = "LoRA Training"
task = "t2v-14B"
dit = "G:/SECourses_Musubi_Trainer_v29/Training_Models_Wan/wan2.1_t2v_14B_bf16.safetensors"
vae = "G:/SECourses_Musubi_Trainer_v29/Training_Models_Wan/Wan2_1_VAE_bf16.safetensors"
